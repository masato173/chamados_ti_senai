spring.application.name=chamados

# Banco de dados (PostgreSQL)
# Os valores vêm de variáveis de ambiente; o que está após ":" é o padrão local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chamados_ti}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA: o esquema é criado só pelo Flyway; o Hibernate apenas confere.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
